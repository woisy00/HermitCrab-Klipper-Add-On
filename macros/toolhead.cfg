#=====================================================
#  Toolhead: DragonBurner with MK8 Hotend + Servo Probe
#=====================================================
[virtual_pins]

[delayed_gcode load_last_toolhead]
initial_duration: 1.0
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set last_head = svv.active_head|default("emil") %}
    
    {action_respond_info("=== Systemstart: Lade letzten Toolhead: " ~ last_head|upper ~ " ===")}
    SET_HEAD HEAD={last_head}


[gcode_macro USE_HEAD_EMIL]
description: Schaltet auf Toolhead Emil
gcode:
    SET_HEAD HEAD=emil

[gcode_macro USE_HEAD_WILLI]
description: Schaltet auf Toolhead Willi
variable_color: 'success'
variable_icon: 'cat'
gcode:
    SET_HEAD HEAD=willi

[output_pin TOOLHEAD_EMIL]
pin: virtual_pin:head_emil
value: 0

[output_pin TOOLHEAD_WILLI]
pin: virtual_pin:head_willi
value: 0

[probe_offset_runtime]

[gcode_macro SET_HEAD]
description: Wechselt den Toolhead (HEAD=emil oder HEAD=willi) und setzt alle Parameter flach aus variables.cfg
gcode:
    {% set head = params.HEAD|default("emil")|lower %}
    {% set svv = printer.save_variables.variables %}
    
    # Validierung
    {% if head not in ["emil", "willi"] %}
        { action_raise_error("Unbekannter Toolhead! Bitte 'emil' oder 'willi' angeben.") }
    {% endif %}

    # Status-Flags in Fluidd schalten
    {% set prev_head = svv.active_head|default("emil")|upper %}
    SET_PIN PIN=TOOLHEAD_{prev_head} VALUE=0

    # 1. Aktiven Kopf permanent speichern
    SAVE_VARIABLE VARIABLE=active_head VALUE="'{head}'"

    # 2. Werte dynamisch über den Präfix (emil_ / willi_) auslesen
    {% set z_off   = svv[head ~ '_z_offset']|default(0.0)|float %}
    {% set x_off   = svv[head ~ '_x_offset']|default(0.0)|float %}
    {% set y_off   = svv[head ~ '_y_offset']|default(0.0)|float %}
    #{% set kp      = svv[head ~ '_pid_kp']|default(0.0)|float %}
    #{% set ki      = svv[head ~ '_pid_ki']|default(0.0)|float %}
    #{% set kd      = svv[head ~ '_pid_kd']|default(0.0)|float %}

    # 3. Z-Offset und Probe X/Y-Offsets anwenden ; X={x_off} Y={y_off} 
    SET_PROBE_OFFSET X={x_off} Y={y_off} Z={z_off}
    {action_respond_info("=== Toolhead " ~ head|upper ~ " geladen ===")}
    {action_respond_info("Z-Offset: " ~ z_off ~ " mm | Probe X/Y: " ~ x_off ~ "/" ~ y_off ~ " mm")}

    # Debug: Alle gespeicherten Variablen fuer den gewaehlten Toolhead ausgeben
    { action_respond_info("--- Stored variables for '" ~ head ~ "' ---") }
    {% for key, val in svv | dictsort %}
        {% if key.startswith(head ~ '_') %}
            { action_respond_info("  " ~ key ~ " = " ~ (val | string)) }
        {% endif %}
    {% endfor %}

    # 4. PID-Werte setzen
    #{% if kp > 0 %}
    #    SET_HEATER_PID HEATER=extruder KP={kp} KI={ki} KD={kd}
    #    {action_respond_info("PID: P=" ~ kp ~ " I=" ~ ki ~ " D=" ~ kd)}
    #{% endif %}

    # M117 schickt Text direkt an das Drucker-Display (und HelixScreen)
    M117 Toolhead: {head|upper}
    SET_PIN PIN=TOOLHEAD_{head|upper} VALUE=1

[gcode_macro SAVE_HEAD]
description: Speichert die aktuelle konfiguration für den aktiven Toolhead
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set current_head = svv.active_head|default("emil") %}

    {% set current_offset = printer.configfile.settings.probe.z_offset|float %}  
    {% set pending = printer.configfile.save_config_pending_items %}
    {% if 'probe' in pending and 'z_offset' in pending.probe %}
        {% set current_offset = pending.probe.z_offset|float %}
    {% endif %}

    SAVE_VARIABLE VARIABLE={current_head}_z_offset VALUE={current_offset}
    
    {action_respond_info("Z-Offset fuer " ~ current_head ~ " gespeichert: " ~ current_offset ~ "mm")}
