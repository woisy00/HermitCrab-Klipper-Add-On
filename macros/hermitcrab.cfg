#=====================================================
#  HermitCrab toolhead manager
#  Toolhead values live in toolheads.cfg as [hc_head <name>] sections.
#=====================================================
[include toolheads.cfg]

[hermitcrab]
# Path relative to printer.cfg (or absolute)
file: hc/toolheads.cfg
default_head: <default>
heater: extruder
extruder: extruder
pin_prefix: TOOLHEAD_

# Load the last active head at startup (SET_HEAD without HEAD= uses the
# active_head stored in [hermitcrab state])
[delayed_gcode load_last_toolhead]
initial_duration: 1.0
gcode:
    SET_HEAD

[gcode_macro SET_HEAD]
description: Apply a toolhead (HEAD=<name>, default: active head)
gcode:
    HC_SET_HEAD {rawparams}

[gcode_macro SAVE_HEAD]
description: Store current or given values in a toolhead section
gcode:
    HC_SAVE_HEAD {rawparams}

[gcode_macro ADD_HEAD]
description: Add an empty toolhead section (NAME=<name>)
gcode:
    HC_ADD_HEAD {rawparams}

[gcode_macro HEAD_INFO]
description: Show stored values of a toolhead (HEAD=<name>)
gcode:
    HC_HEAD_INFO {rawparams}

[gcode_macro SET_PROBE_OFFSET]
description: Set probe X/Y/Z offset at runtime (re-home Z after changing Z)
gcode:
    HC_SET_PROBE_OFFSET {rawparams}
